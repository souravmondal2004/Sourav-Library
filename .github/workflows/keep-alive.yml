name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Cloud Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP ping
        run: |
          echo "Pinging Sourav's Library Cloud API on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://sourav-library.onrender.com/api/documents?page=0&size=1")
          echo "Response HTTP status: $HTTP_STATUS"
