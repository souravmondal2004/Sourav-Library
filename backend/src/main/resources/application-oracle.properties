# Oracle Database Configuration
# Standard thin driver URL syntax:
# jdbc:oracle:thin:@//<host>:<port>/<service_name>
# e.g., jdbc:oracle:thin:@//localhost:1521/XEPDB1 or jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USER:SCRIBD_USER}
spring.datasource.password=${ORACLE_PASSWORD:scribd_pass123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool settings for Oracle
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate with Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
