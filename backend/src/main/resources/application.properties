spring.application.name=scribd-clone-backend

# Active profile: set to 'oracle' to connect to Oracle DB, or 'dev' for in-memory H2 (Oracle mode)
spring.profiles.active=dev

# Server Port
server.port=${PORT:8080}

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
spring.servlet.multipart.file-size-threshold=2MB

# Storage Paths & Cloud Configuration
scribd.storage.type=google-drive
scribd.storage.upload-dir=uploads
scribd.storage.documents-dir=uploads/documents
scribd.storage.covers-dir=uploads/covers

# Google Drive Cloud Storage (Primary Document Store)
scribd.storage.google-drive.enabled=true
scribd.storage.google-drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:1ZwKXAE2dM9JmJIGl2HZap1RiW9CSeVPS}
scribd.storage.google-drive.credentials-path=classpath:google-credentials.json
# Personal @gmail.com OAuth 2.0 Credentials (Bypasses Service Account 0-byte quota restriction)
scribd.storage.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
scribd.storage.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
scribd.storage.google-drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}


# JWT Configuration (30 days validity)
scribd.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
scribd.jwt.expiration-ms=2592000000

# Logging
logging.level.com.scribd.clone=INFO
logging.level.org.springframework.security=WARN

# Database Connection Pool & JPA Lifecycle Optimization
# Disable Open-Session-In-View to release DB connections immediately after transaction
spring.jpa.open-in-view=false

# Embedded Tomcat Memory & Concurrency Optimization for 512MB Container
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=100
server.tomcat.accept-count=20

