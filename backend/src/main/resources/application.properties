spring.application.name=scribd-clone-backend

# Active profile: set to 'oracle' to connect to Oracle DB, or 'dev' for in-memory H2 (Oracle mode)
spring.profiles.active=dev

# Server Port
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Storage Paths (relative to backend run directory or configurable)
scribd.storage.upload-dir=uploads
scribd.storage.documents-dir=uploads/documents
scribd.storage.covers-dir=uploads/covers

# JWT Configuration
scribd.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
scribd.jwt.expiration-ms=86400000

# Logging
logging.level.com.scribd.clone=INFO
logging.level.org.springframework.security=WARN
