databases:
  - name: sourav-library-db
    databaseName: scribddb
    user: scribd_user
    plan: free
    region: oregon

services:
  # Backend Web Service
  - type: web
    name: sourav-library-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sourav-library-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=40.0"

  # Frontend Static Site
  - type: web
    name: sourav-library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
