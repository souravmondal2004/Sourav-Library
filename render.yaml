services:
  # Backend Web Service
  - type: web
    name: sourav-library
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xms128m -Xmx256m -XX:MaxMetaspaceSize=140m -XX:CompressedClassSpaceSize=32m -Xss512k -Dfile.encoding=UTF-8"
      - key: RENDER_EXTERNAL_URL
        value: https://sourav-library.onrender.com
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1ZwKXAE2dM9JmJIGl2HZap1RiW9CSeVPS
      - key: SCRIBD_STORAGE_GOOGLE_DRIVE_ENABLED
        value: "true"

  # Frontend Static Site
  - type: web
    name: sourav-library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sourav-library.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sourav-library.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
