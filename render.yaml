databases:
  - name: sourav-library-db
    databaseName: scribddb
    user: scribd_user
    plan: free
    region: oregon

services:
  # Backend Web Service
  - type: web
    name: sourav-library
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: sourav-library-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sourav-library-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=40.0"
      - key: RENDER_EXTERNAL_URL
        value: https://sourav-library.onrender.com

  # Frontend Static Site
  - type: web
    name: sourav-library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sourav-library.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sourav-library.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
